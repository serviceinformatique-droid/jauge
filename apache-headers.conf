<IfModule mod_headers.c>
    # Retire le blocage par défaut d'affichage en iframe
    Header always unset X-Frame-Options

    # Autorise l'intégration en iframe depuis ndmissions.fr (adapter le domaine si besoin)
    Header always set Content-Security-Policy "frame-ancestors 'self' https://*.ndmissions.fr https://ndmissions.fr"
</IfModule>
